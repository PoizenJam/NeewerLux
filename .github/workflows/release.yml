# Build NeewerLux on every push to main and keep one draft release per version up to date:
#   - NeewerLux-<version>-Windows.zip  (PyInstaller --onedir EXE + light_prefs/)
#   - NeewerLux-<version>-Source.zip   (Python source distribution)
# The version comes from pyproject.toml. Each push replaces the draft for that version, so the
# newest test build is always on the Releases page. A draft creates no tag; publishing it
# creates v<version> at the commit it was built from. Pushing with a version that is already
# published fails instead of touching the published release: bump the version first.

name: Build Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # Needed to create releases

concurrency:
  group: release-draft
  cancel-in-progress: true  # a newer push supersedes a build still running

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: '3.13'
          enable-cache: true

      # --locked asserts uv.lock is already in agreement with pyproject.toml and
      # fails the build otherwise, so a release can never be cut from a stale or
      # uncommitted dependency resolution. (--frozen would only skip updating the
      # lock, which silently installs stale contents instead of failing.)
      - name: Install dependencies
        run: uv sync --locked --group build --group audio

      - name: Build EXE with PyInstaller
        run: uv run --locked --group build --group audio pyinstaller NeewerLux.spec

      - name: Copy light_prefs into dist
        run: |
          Copy-Item -Path "light_prefs" -Destination "dist/NeewerLux/light_prefs" -Recurse
          Copy-Item -Path "README.md" -Destination "dist/NeewerLux/"
          Copy-Item -Path "CHANGELOG.md" -Destination "dist/NeewerLux/"
          Copy-Item -Path "LICENSE" -Destination "dist/NeewerLux/"
          Copy-Item -Path "docs" -Destination "dist/NeewerLux/docs" -Recurse

      - name: Create EXE zip
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path "dist/NeewerLux/*" -DestinationPath "NeewerLux-${version}-Windows.zip"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: NeewerLux-*-Windows.zip

  build-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source zip
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          zip -r "NeewerLux-${VERSION}-Source.zip" \
            NeewerLux.py \
            light_models.toml \
            LICENSE \
            neewerlux_ui.py \
            neewerlux_theme.py \
            neewerlux_webui.py \
            neewerlux_anim_editor.py \
            neewerlux_show.py \
            neewerlux_audio.py \
            neewerlux_sim.py \
            neewerlux_stage.py \
            neewerlux_timeline.py \
            NeewerLux.bat \
            NeewerLux-HTTP.bat \
            pyproject.toml \
            uv.lock \
            com.github.poizenjam.NeewerLux.desktop \
            com.github.poizenjam.NeewerLux.ico \
            com.github.poizenjam.NeewerLux.png \
            README.md \
            CHANGELOG.md \
            docs/ \
            light_prefs/

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-zip
          path: NeewerLux-*-Source.zip

  create-release:
    needs: [build-windows-exe, build-source]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace the draft for this version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"v$VERSION\" and (.draft | not)) | .id")
          if [ -n "$published" ]; then
            echo "::error::v$VERSION is already published; bump the version in pyproject.toml and NeewerLux.py for new test builds"
            exit 1
          fi
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"v$VERSION\" and .draft) | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.version.outputs.version }}
          name: NeewerLux ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            NeewerLux-*-Windows.zip
            NeewerLux-*-Source.zip
